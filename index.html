<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#dfe9f5" />
    <title>Simple 3D World</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="world" aria-label="Simple 3D world"></main>

    <div class="touch-controls" aria-label="iPad controls">
      <div
        id="joystick"
        class="joystick"
        role="application"
        aria-label="Drag to move the cube"
      >
        <div id="joystick-knob" class="joystick__knob" aria-hidden="true"></div>
      </div>

      <button id="jump-button" class="jump-button" type="button" aria-label="Jump">
        JUMP
      </button>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
